<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stikkky</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1033;--paper:#FFF6D6;--bg:#FF3D81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--bg);transition:background .7s;color:var(--ink);font-family:'Bowlby One',Impact,'Arial Black',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0}#fx{z-index:3}
#stage{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,4vh,34px);padding:20px;text-align:center;transition:opacity .3s,transform .3s}
#stage.out{opacity:0;transform:scale(.8) rotate(-3deg)}
#stage.shake{animation:shake .55s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-14px,6px) rotate(-2deg)}30%{transform:translate(12px,-8px) rotate(2deg)}45%{transform:translate(-10px,-4px)}60%{transform:translate(9px,7px) rotate(-1deg)}80%{transform:translate(-4px,2px)}}
.logo{width:clamp(170px,52vw,340px);height:auto;filter:drop-shadow(0 8px 0 rgba(26,16,51,.35));animation:pop .9s cubic-bezier(.2,1.7,.4,1) both,float 3s ease-in-out infinite alternate;transition:width .5s;cursor:pointer;-webkit-user-drag:none}
.logo.min{width:clamp(120px,34vw,200px)}
@keyframes float{from{translate:0 0;rotate:-2deg}to{translate:0 -8px;rotate:2deg}}
a.btn{display:inline-block;text-decoration:none;-webkit-text-stroke:0}
#t{margin:0;max-width:16ch;font-weight:400;line-height:1.08;font-size:clamp(34px,9vw,84px);color:var(--paper);-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink)}
#t.sm{font-size:clamp(26px,6.4vw,54px);max-width:20ch}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;animation:pop .55s cubic-bezier(.2,1.7,.4,1) both,bob 2.2s ease-in-out infinite alternate}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes bob{from{translate:0 0;rotate:-1.5deg}to{translate:0 -7px;rotate:1.5deg}}
#acts{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;min-height:84px;align-items:center}
.btn{font:inherit;font-size:clamp(20px,5vw,28px);color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:999px;padding:14px 38px;box-shadow:0 8px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s;animation:pop .6s cubic-bezier(.2,1.7,.4,1) both;touch-action:none}
.btn:hover{transform:translateY(-3px) rotate(-2deg);box-shadow:0 11px 0 var(--ink)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible{outline:4px dashed var(--paper);outline-offset:6px}
#yes{background:#3DDC97}#no{background:#FFD60A}
.hold{position:relative;overflow:hidden;width:min(88vw,440px);padding:20px 24px;font-size:clamp(17px,4.4vw,24px)}
.hold:hover{transform:none;box-shadow:0 8px 0 var(--ink)}
.hold:active{transform:translateY(4px);box-shadow:0 4px 0 var(--ink)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#FF3D81,#FFD60A);border-right:4px solid var(--ink)}
.hold span{position:relative;z-index:1}
#cap{min-height:1.3em;margin:0;color:var(--paper);font-size:clamp(16px,4vw,24px);-webkit-text-stroke:.16em var(--ink);paint-order:stroke fill}
.fb{color:var(--paper);font-size:16px;-webkit-text-stroke:.2em var(--ink);paint-order:stroke fill}
@media (prefers-reduced-motion:reduce){.l{animation:pop .3s both}#stage.shake{animation:none}}
</style>
</head>

<script>
const WA='https://wa.me/21629621823';
const $=s=>document.querySelector(s);

 {bg:'#FF3D81',cols:['#FFD60A','#2D5BFF','#3DDC97','#FFF6D6']},
 {bg:'#2D5BFF',cols:['#FF3D81','#FFD60A','#3DDC97','#FFF6D6']},
 {bg:'#3DDC97',cols:['#FF3D81','#FFD60A','#2D5BFF','#FFF6D6']}
];
let W,H,D=Math.min(devicePixelRatio||1,2),step=0,shapes=[],parts=[],rings=[],mx=-999,my=-999;

function size(){W=innerWidth;H=innerHeight;for(const c of [bgc,fxc]){c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px'}b.setTransform(D,0,0,D,0,0);f.setTransform(D,0,0,D,0,0)}
function mkShapes(){const n=Math.round(Math.min(34,Math.max(14,W*H/24000)));shapes=[];for(let i=0;i<n;i++){const vx=R(-.5,.5),vy=R(-.5,.5);shapes.push({x:R(0,W),y:R(0,H),s:R(18,46),t:i%4,r:R(0,6.3),vr:R(-.02,.02),vx,vy,bx:vx,by:vy,k:1,col:STEPS[0].cols[i%4]})}}
function path(c,ty,s){c.beginPath();
 if(ty==0){for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i*Math.PI/5-Math.PI/2;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath()}
 else if(ty==1){c.moveTo(0,s*.9);c.bezierCurveTo(-s*1.3,s*.1,-s*.7,-s*.9,0,-s*.35);c.bezierCurveTo(s*.7,-s*.9,s*1.3,s*.1,0,s*.9)}
 else if(ty==2){c.arc(0,0,s*.8,0,7)}
 else{c.moveTo(0,-s);c.lineTo(s,s*.8);c.lineTo(-s,s*.8);c.closePath()}}
function burst(x,y,n,cols){cols=cols||STEPS[step].cols;for(let i=0;i<n;i++){const a=R(0,6.3),v=R(2,10);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:0,max:R(40,80),col:cols[i%cols.length],sz:R(5,12),r:R(0,6),vr:R(-.3,.3),sq:Math.random()<.5})}rings.push({x,y,r:6,life:0})}

// hold button state

function update(dt){
 for(const s of shapes){

  s.x+=s.vx;s.y+=s.vy;s.r+=s.vr;s.k+=(1-s.k)*.08;
  if(s.x<-60)s.x=W+60;if(s.x>W+60)s.x=-60;if(s.y<-60)s.y=H+60;if(s.y>H+60)s.y=-60;
 }
 if(hb&&!done){

 for(const s of shapes){b.save();b.translate(s.x,s.y);b.rotate(s.r);b.scale(s.k,s.k);path(b,s.t,s.s);b.lineJoin='round';b.lineWidth=12;b.strokeStyle='#FFF6D6';b.stroke();b.fillStyle=s.col;b.fill();b.restore()}

 for(const r of rings){f.globalAlpha=1-r.life/22;f.lineWidth=6;f.strokeStyle='#FFF6D6';f.beginPath();f.arc(r.x,r.y,r.r,0,7);f.stroke()}

function say(txt,small){t.className=small?'sm':'';t.innerHTML='';let i=0;

  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  document.body.style.setProperty('--bg','#FF2A2A');setTimeout(()=>document.body.style.setProperty('--bg',STEPS[step].bg),450);
  const r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,50,['#1A1033','#FF2A2A','#FFF6D6']);
  cap.textContent='wrong answer 😏 try again';
 };
}
function mkHold(){
 const x=document.createElement('button');x.className='btn hold';x.innerHTML='<i class="fill"></i><span>💬 hold to chat on WhatsApp</span>';
 acts.appendChild(x);hb=x;fill=x.querySelector('.fill');lab=x.querySelector('span');prog=0;done=false;holding=false;
 const on=e=>{holding=true;e.preventDefault()},off=()=>{holding=false};
 x.addEventListener('pointerdown',on);addEventListener('pointerup',off);addEventListener('pointercancel',off);
 x.addEventListener('contextmenu',e=>e.preventDefault());
 x.addEventListener('keydown',e=>{if(e.key==' '||e.key=='Enter'){holding=true;e.preventDefault()}});
 x.addEventListener('keyup',off);
}
function finish(){
 done=true;holding=false;fill.style.width='100%';lab.textContent='opening WhatsApp…';hb.style.transform='';
 for(let i=0;i<4;i++)setTimeout(()=>burst(R(W*.2,W*.8),R(H*.2,H*.7),50),i*130);
 cap.innerHTML='<a class="btn" href="'+WA+'" target="_blank" rel="noopener">open WhatsApp 💬</a>';
 setTimeout(()=>{const a=document.createElement('a');a.href=WA;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()},500);
}
$('#logo').addEventListener('pointerdown',e=>{e.currentTarget.animate([{transform:'scale(1)'},{transform:'scale(1.25) rotate(-8deg)'},{transform:'scale(1)'}],{duration:350})});
addEventListener('pointerdown',e=>{burst(e.clientX,e.clientY,18)});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(Math.random()<.35)parts.push({x:mx,y:my,vx:R(-1,1),vy:R(-2,0),life:0,max:30,col:STEPS[step].cols[(Math.random()*4)|0],sz:R(4,8),r:0,vr:.2,sq:false})});
addEventListener('pointerleave',()=>{mx=my=-999});
addEventListener('resize',()=>{size();mkShapes()});
size();mkShapes();setBg();requestAnimationFrame(loop);go(0);
</script>
